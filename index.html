<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="EduTrack — the operating system for academic records, departments and access." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EduTrack — Campus Operations Platform</title>

    <!-- Resolve the theme before first paint to avoid a flash of the wrong scheme -->
    <script>
      {
        const meta = document.querySelector('meta[name="color-scheme"]');
        let pinned = null;
        try { pinned = localStorage.getItem("edutrack-theme"); } catch {}
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const theme = pinned === "light" || pinned === "dark" ? pinned : system;
        document.documentElement.dataset.theme = theme;
        if (pinned === "light" || pinned === "dark") meta.content = pinned;
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
